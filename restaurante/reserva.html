    <!--Parte de la reserva-->
    <div class="container mt-5 p-4">
        <div class=" shadow p-4 rounded-2 caja-reserva bg-secondary text-white">
            <h2 class="text-center mb-3 border-top border-white"><strong>Reserva tu mesa</strong></h2>
            <p class="text-center text-muted mb-4 border-bottom border-white">
                Completa el formulario y te confirmaremos tu reserva.
            </p>
            <form>
                <div class="mb-3">
                <label class="form-label"><strong>Nombre completo</strong></label>
                <input type="text" class="form-control" placeholder="Ej: Juan Pérez" id="nombre">
                </div>

                <div class="mb-3">
                <label class="form-label"><strong>Correo electrónico</strong></label>
                <input type="email" class="form-control" placeholder="correo@ejemplo.com" id="correo">
                </div>

                <div class="mb-3">
                <label class="form-label" ><strong>Fecha de la reserva</strong></label>
                <input type="date" class="form-control" id="fecha">
                </div>

                <div class="mb-3">
                <label class="form-label"><strong>Hora</strong></label>
                <input type="time" class="form-control" id="hora">
                </div>

                <div class="mb-5">
                <label class="form-label" ><strong>Número de personas</strong></label>
                <select class="form-select" >
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5+</option>
                </select>
                </div>

                <div class="d-grid">
                <button type="button" class="btn btn-info btn-lg text-white sombreado" onclick="ConfirmarReserva()">
                    Reservar ahora
                </button>
                </div>
            </form>
        </div>
    </div>
