        <div class="row ">
            <div class="col-md-6 bg-secondary rounded-2 text-white text-bg-dark">
                <h2 class="mb-4 pt-3">Contáctanos!</h2>
                <form action="">
                    <div class="mb-3">
                        <label for="nombre">Nombre:</label>
                        <input type="text" name="" id="nombre" class="form-control">
                    </div>
                    <div class="mb-3">

                    <div class="mb-3">
                        <label for="mensaje" class="form-label">Mensaje</label>
                        <textarea class="form-control" name="" id="mensaje" rows="4"></textarea>
                    </div>
                    <div class="mt-4 text-center">
                        <button type="button" class="mt-4 mb-3 btn btn-info sombreado text-white" onclick="enviarmensaje()">Enviar</button>
